# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.2.0
  last_upgraded: 2026-10-19

project:
  stage: Concept

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

modes:
  rigor: full
  automation: guided

engine:
  name: "Unity"
  version: "6.6"
  language: "C#"
  rendering: "URP"
  physics: "PhysX"
  path: "/Applications/Unity/Hub/Editor/6000.6.7f1/Unity.app/Contents/MacOS/Unity"   # verified installed 2026-11-01 (6000.6.7f1)
  # Unity project: /Users/nouressoussi/Desktop/mars-needs-water/MarsNeedsWater — Unity project lives outside this repo; ./Assets is a symlink to its Assets folder

specialists:
  code: "unity-specialist"
  shader: "unity-shader-specialist"
  ui: "unity-ui-specialist"
  additional: ["unity-dots-specialist", "unity-addressables-specialist"]

naming:
  classes: PascalCase
  variables: camelCase
  constants: SCREAMING_SNAKE   # UNVERIFIED — not sourceable from
                               # docs/engine-reference/unity/; confirm before relying on it
  signals: PascalCase On<Event>
  files: PascalCase
  scenes: PascalCase

commands:
  # Unity project is at /Users/nouressoussi/Desktop/mars-needs-water/MarsNeedsWater (not this repo's root). -buildTarget value not checked against Unity's CLI docs.
  # run launches a Windows .exe, which does not run on macOS; change via /settings if you build for Mac locally.
  build: '"/Applications/Unity/Hub/Editor/6000.6.7f1/Unity.app/Contents/MacOS/Unity" -batchmode -quit -projectPath /Users/nouressoussi/Desktop/mars-needs-water/MarsNeedsWater -buildTarget Win64 -buildWindows64Player /Users/nouressoussi/Desktop/mars-needs-water/MarsNeedsWater/Builds/Win64/MarsNeedsWater.exe'
  test: '"/Applications/Unity/Hub/Editor/6000.6.7f1/Unity.app/Contents/MacOS/Unity" -batchmode -runTests -projectPath /Users/nouressoussi/Desktop/mars-needs-water/MarsNeedsWater -testPlatform EditMode -testResults test-results/editmode.xml'
  run: "/Users/nouressoussi/Desktop/mars-needs-water/MarsNeedsWater/Builds/Win64/MarsNeedsWater.exe -screen-width 1280 -screen-height 720 -screen-fullscreen 0"
  smoke: '"/Applications/Unity/Hub/Editor/6000.6.7f1/Unity.app/Contents/MacOS/Unity" -batchmode -quit -projectPath /Users/nouressoussi/Desktop/mars-needs-water/MarsNeedsWater -logFile -'
