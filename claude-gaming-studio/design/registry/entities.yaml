# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: simulation_step
    status: active
    source: design/gdd/game-state-and-simulation.md
    referenced_by:
      - design/gdd/game-state-and-simulation.md
    variables:
      - dt
      - frameDt
      - maxCatchUp
      - acc
      - alpha
    output_range: [0, 5]
    expression: "acc = min(acc + frameDt, maxCatchUp); while acc >= dt: Tick(), acc -= dt; alpha = acc / dt"
    notes: "Output = ticks per frame (5 at defaults). alpha (0-1) is read by presentation systems (Drawdown, HUD) to interpolate between ticks. All rates elsewhere are per second."
    added: 2026-11-02
    revised: ""
  - name: withdraw
    status: active
    source: design/gdd/water-source-model.md
    referenced_by:
      - design/gdd/water-source-model.md
    variables:
      - amount
      - remaining
      - granted
      - drainedEpsilon
    output_range: [0, remaining]
    expression: "granted = min(max(amount, 0), remaining); remaining -= granted; if remaining <= drainedEpsilon then remaining = 0"
    notes: "Called by Hand Tools (tick step 1) and Hose/Storage Network (step 2, already split across pumps). NaN amount counts as 0."
    added: 2026-11-02
    revised: ""
  - name: drawdown_pct
    status: active
    source: design/gdd/water-source-model.md
    referenced_by:
      - design/gdd/water-source-model.md
    variables:
      - start
      - remaining
    output_range: [0, 100]
    expression: "(start - remaining) / start * 100"
    notes: "Per source; start is the copy saved at new game. Drawdown thresholds and the play log's lake_drained_pct use the lake's value."
    added: 2026-11-02
    revised: ""

  - name: payout
    status: active
    source: design/gdd/economy-progression-and-shop.md
    referenced_by:
      - design/gdd/economy-progression-and-shop.md
    variables:
      - litres
      - credits_per_litre
      - region_multiplier
      - contract_multiplier
    output_range: [0.001, null]
    expression: "litres * credits_per_litre * region_multiplier * contract_multiplier"
    notes: "Paid by Shipping's direct CreditLaunch(litres) call at liftoff (tick step 2c), never by a listener. Rounded once to whole millicredits. Non-finite or <= 0 litres ignored. MVP: credits_per_litre 10, multipliers 1. Unbounded above."
    added: 2026-11-02
    revised: ""
  - name: flow_solve
    status: active
    source: design/gdd/hose-storage-and-flow-network.md
    referenced_by:
      - design/gdd/hose-storage-and-flow-network.md
      - design/gdd/water-source-model.md
    variables:
      - rate_p
      - hoseCap_p
      - dt
      - space_G
      - got_s
    output_range: [0, 2]
    expression: "d_p = min(rate_p, hoseCap_p)*dt; scale by min(1, space_G/D_G) per pool; then by got_s/D_s per source; deposit entry tank first"
    notes: "Tick step 2. Space applied before source so full pools never draw water. Output = litres per pump per tick at 10 Hz, max 2."
    added: 2026-11-02
    revised: ""
  - name: launch_load
    status: active
    source: design/gdd/shipping-and-launch.md
    referenced_by:
      - design/gdd/shipping-and-launch.md
      - design/gdd/hose-storage-and-flow-network.md
    variables:
      - pad_pool_contents
      - cargo_capacity
    output_range: [0, 1500]
    expression: "min(pad_pool_contents, cargo_capacity)"
    notes: "0 is rejected as nothing_to_ship. LaunchCompleted(litres) raised at liftoff, 3 s after the lever."
    added: 2026-11-02
    revised: ""
  - name: time_to_afford
    status: active
    source: design/gdd/economy-progression-and-shop.md
    referenced_by:
      - design/gdd/economy-progression-and-shop.md
    variables:
      - price
      - credits
      - rate_eff
      - credits_per_litre
    output_range: [0, null]
    expression: "max(0, price - floor(credits)) / (rate_eff * credits_per_litre * region_multiplier * contract_multiplier); infinite when rate_eff = 0"
    notes: "Estimate only. The pacing rule (each step from the bucket on longer than the last) is checked on the pacing simulator (tools/pacing/sim3.py)."
    added: 2026-11-02
    revised: ""

